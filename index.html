<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#70470f,#241706 55%,#080604);display:flex;justify-content:center;padding:24px}.game{width:min(1050px,100%)}header{text-align:center;margin-bottom:18px}h1{margin:0;font-size:42px;letter-spacing:3px;color:#ffd66b;text-shadow:0 0 20px #ffb52e}.sub{color:#e7c98a;margin-top:5px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:#17100aee;border:1px solid #a9782d88;border-radius:20px;box-shadow:0 12px 40px #0009,inset 0 0 25px #ffb52e0a;padding:18px}.score{text-align:center}.coins{font-size:38px;font-weight:800;color:#ffd66b}.rate{color:#d9bd7d;margin-bottom:14px}.portrait{width:min(100%,520px);aspect-ratio:1.28;border-radius:18px;object-fit:cover;border:3px solid #d59a38;box-shadow:0 0 35px #ffb52e55;cursor:pointer;transition:.12s;user-select:none}.portrait:hover{transform:scale(1.015)}.portrait:active{transform:scale(.97)}.hint{margin:12px 0 0;color:#c9b27d}.shop h2{margin-top:0;color:#ffd66b}.upgrade{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;margin:9px 0;border:1px solid #6e4c20;border-radius:13px;background:#21170c;color:#fff;text-align:left;cursor:pointer}.upgrade:hover:not(:disabled){background:#30200d;border-color:#d59a38}.upgrade:disabled{opacity:.42;cursor:not-allowed}.name{font-weight:800}.desc{font-size:12px;color:#bfa979;margin-top:4px}.price{font-weight:800;color:#ffd66b;white-space:nowrap}.bar{height:8px;background:#34240f;border-radius:99px;overflow:hidden;margin-top:14px}.fill{height:100%;width:0;background:linear-gradient(90deg,#c98221,#ffe08a);transition:.2s}.actions{display:flex;gap:8px;margin-top:12px}.small{flex:1;padding:10px;border:1px solid #6e4c20;background:#21170c;color:#e8cf9b;border-radius:10px;cursor:pointer}.float{position:fixed;pointer-events:none;font-weight:900;color:#ffe18a;font-size:24px;animation:float .8s ease-out forwards;text-shadow:0 2px 8px #000}@keyframes float{to{transform:translateY(-80px);opacity:0}}@media(max-width:800px){.layout{grid-template-columns:1fr}h1{font-size:32px}}
<style>
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.tab{padding:10px 14px;border:1px solid #76531f;background:#21170c;color:#f4d89a;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{background:#5b3a0d;border-color:#d59a38;color:#ffe08a}.panel{display:none}.panel.active{display:block}.skin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.skin{background:#21170c;border:1px solid #6e4c20;border-radius:15px;padding:12px}.skin h3{margin:0 0 5px;color:#ffd66b}.skin p{margin:5px 0;color:#c9b27d;font-size:13px}.skin button,.admin button{width:100%;padding:10px;border:1px solid #8d6426;background:#30200d;color:#ffe1a0;border-radius:9px;cursor:pointer;font-weight:700}.skin button:disabled{opacity:.45;cursor:not-allowed}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#5b3a0d;color:#ffe08a;font-size:11px;margin-left:5px}.admin-box{display:grid;gap:10px}.admin-box input{width:100%;padding:11px;border-radius:9px;border:1px solid #6e4c20;background:#110c07;color:white}.admin-note{font-size:12px;color:#bfa979;line-height:1.45}.playerbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.playerbar input{flex:1;min-width:180px;padding:10px;border-radius:9px;border:1px solid #6e4c20;background:#110c07;color:white}.owned{border-color:#d59a38}.admin-list{margin-top:10px;color:#d8c08c;font-size:13px;line-height:1.7}
