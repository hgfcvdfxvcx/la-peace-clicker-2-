document.getElementById("portrait").src=img;
let state=JSON.parse(localStorage.getItem("laPeaceClicker")||"null")||{coins:0,total:0,upgrades:{}};
const upgrades=[
{id:"wisdom",name:"Visdom",desc:"+1 poäng per klick",base:25,click:1,pps:0},
{id:"meditation",name:"Meditation",desc:"+2 poäng per sekund",base:100,click:0,pps:2},
{id:"beard",name:"Visdomens skägg",desc:"+10 poäng per sekund",base:500,click:0,pps:10},
{id:"peace",name:"Peace Aura",desc:"+5 poäng per klick",base:1000,click:5,pps:0},
{id:"temple",name:"Peace Temple",desc:"+50 poäng per sekund",base:5000,click:0,pps:50},
{id:"legend",name:"LA PEACE Legend",desc:"+25 poäng per klick och +100/s",base:20000,click:25,pps:100}
];
const level=u=>state.upgrades[u.id]||0;
const price=u=>Math.floor(u.base*Math.pow(1.65,level(u)));
const clickPower=()=>1+upgrades.reduce((n,u)=>n+u.click*level(u),0);
const pps=()=>upgrades.reduce((n,u)=>n+u.pps*level(u),0);
function fmt(n){if(n<1000)return Math.floor(n).toLocaleString("sv-SE");const units=["K","M","B","T","Qa","Qi"];let i=-1;while(n>=1000&&i<units.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0)+units[i]}
function render(){
 document.getElementById("coins").textContent=fmt(state.coins);
 document.getElementById("pps").textContent=fmt(pps());
 document.getElementById("fill").style.width=Math.min(100,state.coins/Math.max(100,price(upgrades[0]))*100)+"%";
 const shop=document.getElementById("shop");shop.innerHTML="";
 upgrades.forEach(u=>{const l=level(u),p=price(u),b=document.createElement("button");b.className="upgrade";b.disabled=state.coins<p;b.innerHTML='<span><div class="name">'+u.name+' • Lv '+l+'</div><div class="desc">'+u.desc+'</div></span><span class="price">'+fmt(p)+' ☮️</span>';b.onclick=()=>buy(u);shop.appendChild(b)})
}
function buy(u){const p=price(u);if(state.coins<p)return;state.coins-=p;state.upgrades[u.id]=(state.upgrades[u.id]||0)+1;save();render()}
function popup(text,x,y){const el=document.createElement("div");el.className="float";el.textContent=text;el.style.left=x+"px";el.style.top=y+"px";document.body.appendChild(el);setTimeout(()=>el.remove(),800)}
document.getElementById("portrait").onclick=e=>{const gain=clickPower();state.coins+=gain;state.total+=gain;popup("+"+fmt(gain)+" ☮️",e.clientX,e.clientY);render()};
function save(){localStorage.setItem("laPeaceClicker",JSON.stringify(state))}
document.getElementById("save").onclick=()=>{save();popup("SPARAT!",innerWidth/2,innerHeight-80)};
document.getElementById("reset").onclick=()=>{if(confirm("Vill du verkligen börja om?")){state={coins:0,total:0,upgrades:{}};save();render()}};
setInterval(()=>{if(pps()>0){state.coins+=pps();state.total+=pps();render()}},1000);
setInterval(save,5000);render();
</script>
